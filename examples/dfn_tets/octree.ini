# Settings for dfn_tets.py and dfn_tets_suite.py with poisson_disk's
# h_lookup octree (LaGriT with PR #303). Use with:
#   python3 dfn_tets.py --settings octree.ini --dfn ... --json ...
# Measured on the eight dfnWorks test cases (results/): near-DFN ratio
# median 0.98 to 1.02, angles after improve_tets at least 31 degrees
# except where a box edge passes near a fracture.
# A setting not listed takes its default; the command line wins.

[dfn_tets]
# h = C * h_dfn next to the DFN
c = 0.74
# h stays at C * h_dfn out to flat * H_MIN from the DFN
flat = 3
# dh/dx away from the DFN
slope = 0.2
# H_MAX = hmax_factor * H_MIN (but at most the box size / min_cells)
hmax_factor = 10
h_lookup = octree
